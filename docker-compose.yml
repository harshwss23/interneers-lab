version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: interneers_mongodb
    restart: always
    ports:
      - "27017:27017" 
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: django_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGO_HOST=mongodb
      - MONGO_DB=interneers_lab
      - MONGO_PORT=27017
      - REDIS_HOST=redis
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: interneers_redis
    restart: always
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  mongodb_data:
